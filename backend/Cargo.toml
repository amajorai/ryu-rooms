[package]
name = "ryu-rooms"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Active-node shared model rooms for Ryu: QR invites, synchronized transcripts, and governed local inference."
repository = "https://github.com/amajorai/ryu-rooms"

[[bin]]
name = "ryu-rooms"
path = "src/main.rs"

[lib]
name = "ryu_rooms"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
async-stream = "0.3"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
ryu-app-events = { path = "../crates/core/app-events", version = "0.2.7" }
ryu-sidecar-runtime = { path = "../crates/core/sidecar-runtime", version = "0.2.7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
